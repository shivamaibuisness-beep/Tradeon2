    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon: #00f0a0;
            --neon2: #00c8ff;
            --bg-dark: #05070f;
            --card-bg: rgba(10, 20, 30, 0.65);
            --glass: blur(14px) saturate(180%);
            --border-glow: 0 0 12px rgba(0, 240, 160, 0.5);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a1428, #02050a 90%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* ----- ANIMATED BACKGROUND LAYERS ----- */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 160, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 160, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            animation: gridShift 40s linear infinite;
        }

        @keyframes gridShift {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        .orb {
            position: fixed;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(0, 240, 160, 0.08), transparent 70%);
            top: -30vmax;
            right: -30vmax;
            z-index: 0;
            pointer-events: none;
            animation: orbFloat 18s ease-in-out infinite;
        }

        .orb2 {
            width: 50vmax;
            height: 50vmax;
            bottom: -20vmax;
            left: -20vmax;
            top: auto;
            right: auto;
            background: radial-gradient(circle at 70% 70%, rgba(0, 200, 255, 0.08), transparent 70%);
            animation: orbFloat2 22s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-5vmax, 8vmax) scale(1.1); }
        }

        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(8vmax, -5vmax) scale(1.15); }
        }

        /* Candlestick background */
        .candles-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.12;
            overflow: hidden;
        }

        .candle-item {
            position: absolute;
            width: 5px;
            animation: candleFloat 7s infinite ease-in-out;
        }

        .candle-body-bg {
            width: 100%;
            border-radius: 2px;
            background: rgba(0, 240, 160, 0.25);
        }

        .candle-body-bg.red {
            background: rgba(255, 60, 100, 0.2);
        }

        @keyframes candleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-40px); }
        }

        /* ----- MAIN CONTAINER ----- */
        .main-wrapper {
            position: relative;
            z-index: 10;
            max-width: 880px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1.2rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Glass card effect */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border: 1px solid rgba(0, 240, 160, 0.2);
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 240, 160, 0.1);
            padding: 2.5rem 2rem;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ----- LOGO ----- */
        .logo-wrap {
            position: relative;
            margin-bottom: 1.8rem;
            animation: logoPop 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
        }

        @keyframes logoPop {
            0% { opacity: 0; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1); }
        }

        .logo-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--neon);
            box-shadow: 0 0 30px rgba(0, 240, 160, 0.6), 0 0 60px rgba(0, 200, 255, 0.3);
            display: block;
            background: #0a0e1a;
            transition: transform 0.3s;
        }

        .logo-img:hover {
            transform: scale(1.03) rotate(1deg);
        }

        .logo-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(0, 240, 160, 0.5);
            animation: ringSpin 8s linear infinite;
            pointer-events: none;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        /* ----- TITLE & SUBTITLE ----- */
        .title-main {
            font-size: clamp(2.2rem, 12vw, 3.8rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 6px;
            background: linear-gradient(120deg, #ffffff, var(--neon), var(--neon2), #ffffff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
            line-height: 1.1;
            margin-bottom: 0.3rem;
            filter: drop-shadow(0 0 20px rgba(0, 240, 160, 0.4));
            text-align: center;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        .subtitle {
            font-size: 0.95rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #9bb5d4;
            margin-bottom: 2rem;
            font-weight: 400;
            text-align: center;
        }

        /* ----- TIMER / COUNTDOWN ----- */
        .timer-section {
            margin: 0.5rem 0 1.2rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-label {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #a0c0e0;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .timer-ring {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 110px;
            height: 110px;
        }

        .timer-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 6;
        }

        .timer-circle-progress {
            fill: none;
            stroke: url(#timerGradient);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 314;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-number {
            position: absolute;
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px var(--neon), 0 0 40px rgba(0, 240, 160, 0.5);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        /* ----- STATS ----- */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            justify-content: center;
            margin: 1.5rem 0 1rem;
            width: 100%;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 240, 160, 0.15);
            border-radius: 20px;
            padding: 0.8rem 1.5rem;

            text-align: center;

        .stat-item:hover {
            border-color: var(--neon);
            box-shadow: 0 0 20px rgba(0, 240, 160, 0.2);
            transform: translateY(-4px);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--neon));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: #8ba0bc;
            text-transform: uppercase;
        }

        /* ----- CTA BUTTON ----- */
        .cta-direct {
            margin: 0.2rem 0 0.8rem;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-telegram {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, #00c87a, #00a0e0);
            border: none;
            border-radius: 60px;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #02070f;
            text-decoration: none;
            box-shadow: 0 12px 30px rgba(0, 200, 255, 0.3), 0 0 30px rgba(0, 240, 160, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: btnGlow 2.5s infinite;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes btnGlow {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(0, 240, 160, 0.4),
                            0 0 20px rgba(0, 200, 255, 0.3);
            }
            50% {
                box-shadow: 0 10px 40px rgba(0, 240, 160, 0.7),
                            0 0 40px rgba(0, 200, 255, 0.5);
            }
        }

        .btn-telegram:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 20px 50px rgba(0, 240, 160, 0.6),
                        0 0 60px rgba(0, 200, 255, 0.5);
        }

        .btn-telegram::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.5),
                transparent
            );
            transition: left 0.6s;
        }

        .btn-telegram:hover::before {
            left: 100%;
        }

        .tg-icon {
            width: 26px;
            height: 26px;
            fill: #02070f;
        }

        /* Features mini grid */
        .features-mini {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin: 1.8rem 0 1rem;
        }

        .feature-mini {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 240, 160, 0.1);
            border-radius: 16px;
            padding: 1rem 0.8rem;

        }

        .feature-mini:hover {
            border-color: var(--neon2);
            background: rgba(0, 240, 160, 0.05);
            transform: translateY(-3px);
        }

        .feature-emoji {
            font-size: 1.8rem;

            margin-bottom: 6px;
        }

        .feature-txt {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #c0d4ec;
            text-transform: uppercase;
        }

        /* Trust badges */
        .trust-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 1rem 0 0.5rem;
        }

        .pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #b0c8e0;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        .pill i {
            color: var(--neon);
            font-style: normal;
            font-weight: 900;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #4f6079;
            letter-spacing: 1px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.2rem;
            width: 100%;
        }

        /* Loading bar */
        .loading-line {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon), var(--neon2));
            z-index: 999;
            animation: loadBar 2s ease-out forwards;
        }

        @keyframes loadBar {
            0% {
                width: 0;
            }
            100% {
                width: 100%;
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 550px) {
            .glass-card {
                padding: 1.8rem 1rem;
                border-radius: 28px;
            }

            .logo-img {
                width: 110px;
                height: 110px;
            }

            .btn-telegram {
                font-size: 1rem;
                padding: 0.9rem 1.8rem;
            }

            .stat-item {
                padding: 0.6rem 1rem;
                min-width: 90px;
            }

            .stat-value {
                font-size: 1.4rem;
            }

            .timer-ring,
            .timer-svg {
                width: 90px;
                height: 90px;
            }

            .timer-number {
                font-size: 2rem;
            }

            .timer-circle-progress {
                stroke-dasharray: 251;
            }
        }
    </style>

    <script>

        (function() {

            // ---------- CREATE CANDLE BACKGROUND ----------

            function createCandles() {

                const container = document.getElementById('candlesBg');

                if (!container) return;

                const count = 35;

                for (let i = 0; i < count; i++) {

                    const candle = document.createElement('div');

                    candle.className = 'candle-item';

                    candle.style.left = (i * 3.1) + '%';

                    candle.style.bottom =
                        (Math.random() * 70 + 10) + '%';

                    const isRed = Math.random() > 0.6;

                    const height =
                        Math.random() * 70 + 20;

                    const wickTop =
                        Math.random() * 18 + 4;

                    const wickBottom =
                        Math.random() * 18 + 4;

                    const body =
                        document.createElement('div');

                    body.className =
                        'candle-body-bg' +
                        (isRed ? ' red' : '');

                    body.style.height =
                        height + 'px';

                    const wickTopEl =
                        document.createElement('div');

                    wickTopEl.style.position =
                        'absolute';

                    wickTopEl.style.left =
                        '50%';

                    wickTopEl.style.transform =
                        'translateX(-50%)';

                    wickTopEl.style.width =
                        '2px';

                    wickTopEl.style.background =
                        'rgba(255,255,255,0.25)';

                    wickTopEl.style.height =
                        wickTop + 'px';

                    wickTopEl.style.bottom =
                        height + 'px';

                    const wickBottomEl =
                        document.createElement('div');

                    wickBottomEl.style.position =
                        'absolute';

                    wickBottomEl.style.left =
                        '50%';

                    wickBottomEl.style.transform =
                        'translateX(-50%)';

                    wickBottomEl.style.width =
                        '2px';

                    wickBottomEl.style.background =
                        'rgba(255,255,255,0.25)';

                    wickBottomEl.style.height =
                        wickBottom + 'px';

                    wickBottomEl.style.top =
                        '100%';

                    candle.appendChild(wickTopEl);

                    candle.appendChild(body);

                    candle.appendChild(wickBottomEl);

                    candle.style.animationDelay =
                        (i * 0.15) + 's';

                    candle.style.animationDuration =
                        (Math.random() * 4 + 5) + 's';

                    container.appendChild(candle);
                }
            }

            // ---------- TIMER & REDIRECT ----------

            const TELEGRAM_URL =
                'https://telegram.me/+r2qMz_G2X540YWE0';

            const TOTAL_SECONDS = 10;

            let timeLeft = TOTAL_SECONDS;

            let timerInterval = null;

            let hasRedirected = false;

            const timerNumberEl =
                document.getElementById('timerNumber');

            const timerProgressEl =
                document.getElementById('timerProgress');

            const circleLength = 314;

            // Init progress

            if (timerProgressEl) {

                timerProgressEl.style.strokeDasharray =
                    circleLength;

                timerProgressEl.style.strokeDashoffset =
                    '0';
            }

            function updateTimerDisplay() {

                if (timerNumberEl) {

                    timerNumberEl.textContent =
                        timeLeft;
                }

                if (timerProgressEl) {

                    const offset =
                        circleLength *
                        (1 - timeLeft / TOTAL_SECONDS);

                    timerProgressEl.style.strokeDashoffset =
                        offset;
                }
            }

            function startTimer() {

                if (timerInterval) {

                    clearInterval(timerInterval);
                }

                timerInterval =
                    setInterval(() => {

                        timeLeft -= 1;

                        updateTimerDisplay();

                        if (timeLeft <= 0) {

                            clearInterval(timerInterval);

                            timerInterval = null;

                            if (!hasRedirected) {

                                hasRedirected = true;

                                // Redirect to Telegram in the same tab
                                window.location.href = TELEGRAM_URL;

                                // Fire pixel
                                if (typeof fbq !== 'undefined') {

                                    fbq(
                                        'track',
                                        'Lead'
                                    );

                                    fbq(
                                        'track',
                                        'CompleteRegistration'
                                    );
                                }
                            }
                        }

                    }, 1000);
            }

            // ---------- PAGE LOAD ----------

            window.addEventListener(
                'load',
                function() {

                    createCandles();

                    updateTimerDisplay();

                    startTimer();

                    // Manual button click

                    const btn =
                        document.getElementById(
                            'telegramBtn'
                        );

                    if (btn) {

                        btn.addEventListener(
                            'click',
                            function(e) {

                                if (
                                    typeof fbq !==
                                    'undefined'
                                ) {

                                    fbq(
                                        'track',
                                        'Lead'
                                    );

                                    fbq(
                                        'track',
                                        'CompleteRegistration'
                                    );
                                }

                            }
                        );
                    }

                }
            );

            // ---------- FALLBACK ----------

            if (
                document.readyState ===
                'complete'
            ) {

                createCandles();

                updateTimerDisplay();

                startTimer();
            }

        })();

    </script>

</body>
</html>
